plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

import java.util.Properties
import java.io.FileInputStream

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.wall.mob"
    compileSdk 34

    defaultConfig {
        applicationId "com.wall.mob"
        minSdk 23
        targetSdk 34
        versionCode 101
        versionName "1.0.1"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile'] != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
           
            debuggable true
        }

        release {
            if (keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.datastore:datastore-core:1.1.1"
    
    // DOWNGRADED FOR API 33 COMPATIBILITY
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.core:core:1.10.1"
    implementation "com.google.android.material:material:1.12.0"
    
    // WORKMANAGER ALIGNMENT
    implementation "androidx.work:work-runtime:2.8.1"
    implementation "androidx.work:work-runtime-ktx:2.8.1" // ADD THIS LINE HERE
    
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-database"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-analytics"

    implementation "com.android.volley:volley:1.2.1"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "org.java-websocket:Java-WebSocket:1.5.3"

    implementation "com.facebook.shimmer:shimmer:0.5.0"
    implementation "com.airbnb.android:lottie:6.1.0"
    implementation "jp.wasabeef:glide-transformations:4.3.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "com.unity3d.ads:unity-ads:4.10.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "jp.co.cyberagent.android:gpuimage:2.1.0"
    implementation "androidx.palette:palette:1.0.0"

}
